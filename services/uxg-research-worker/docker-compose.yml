services:
  uxg-research-worker:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      UXG_RESEARCH_WORKER_TOKEN: ${UXG_RESEARCH_WORKER_TOKEN:?set UXG_RESEARCH_WORKER_TOKEN}
      UXG_RESEARCH_MAX_PAGES: ${UXG_RESEARCH_MAX_PAGES:-12}
      UXG_RESEARCH_MAX_DEPTH: ${UXG_RESEARCH_MAX_DEPTH:-2}
      UXG_RESEARCH_JOB_TIMEOUT_SEC: ${UXG_RESEARCH_JOB_TIMEOUT_SEC:-120}
    restart: unless-stopped
