# Preview-only Fly.io app skeleton — do NOT deploy until secrets verified.
# fly apps create ea-uxg-research-worker --org <org>
# fly secrets set UXG_RESEARCH_WORKER_TOKEN=...
app = "ea-uxg-research-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
