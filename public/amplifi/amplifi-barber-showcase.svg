<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Brick and Blade Give Saturday Back campaign</title>
  <desc id="desc">A premium three-post social campaign visual for Brick and Blade showing recognition, reframe, and conversion posts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d10"/>
      <stop offset="1" stop-color="#22252c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242831"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="44" fill="url(#bg)"/>
  <circle cx="1370" cy="130" r="330" fill="#d6a44a" opacity=".10"/>
  <circle cx="180" cy="880" r="300" fill="#ffffff" opacity=".035"/>

  <g font-family="Arial,Helvetica,sans-serif" fill="#fff">
    <text x="110" y="118" font-size="30" letter-spacing="8" fill="#d6a44a" font-weight="700">BRICK &amp; BLADE</text>
    <text x="110" y="190" font-size="66" font-weight="800">GIVE SATURDAY BACK.</text>
    <text x="110" y="238" font-size="25" fill="#b7bbc5">One business goal. Three coordinated social posts.</text>
  </g>

  <g transform="translate(110 315)" filter="url(#shadow)">
    <g>
      <rect width="405" height="530" rx="28" fill="url(#card)" stroke="#353946"/>
      <rect x="28" y="28" width="349" height="252" rx="20" fill="#111318"/>
      <path d="M78 208c52-88 112-126 182-115 45 7 81 36 107 87v100H78z" fill="#2d323d"/>
      <circle cx="221" cy="129" r="58" fill="#d6a44a" opacity=".72"/>
      <path d="M165 121c17-47 91-59 117-8-7-18-25-39-59-41-29-2-50 18-58 49z" fill="#111318"/>
      <text x="30" y="330" font-family="Arial,Helvetica,sans-serif" fill="#d6a44a" font-size="18" font-weight="700" letter-spacing="3">RECOGNITION</text>
      <text x="30" y="382" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="35" font-weight="800">Saturday is</text>
      <text x="30" y="423" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="35" font-weight="800">already packed.</text>
      <text x="30" y="475" font-family="Arial,Helvetica,sans-serif" fill="#aeb3bd" font-size="20">Errands. Games. Haircuts.</text>
    </g>

    <g transform="translate(438 0)">
      <rect width="405" height="530" rx="28" fill="url(#card)" stroke="#4d4434"/>
      <rect x="28" y="28" width="349" height="252" rx="20" fill="#d6a44a"/>
      <g stroke="#111318" stroke-width="11" stroke-linecap="round">
        <path d="M120 92l165 130"/><path d="M282 94L117 221"/>
      </g>
      <circle cx="116" cy="88" r="34" fill="#111318"/><circle cx="289" cy="88" r="34" fill="#111318"/>
      <text x="30" y="330" font-family="Arial,Helvetica,sans-serif" fill="#d6a44a" font-size="18" font-weight="700" letter-spacing="3">REFRAME</text>
      <text x="30" y="382" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="35" font-weight="800">Handle it</text>
      <text x="30" y="423" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="35" font-weight="800">midweek.</text>
      <text x="30" y="475" font-family="Arial,Helvetica,sans-serif" fill="#aeb3bd" font-size="20">Keep the weekend yours.</text>
    </g>

    <g transform="translate(876 0)">
      <rect width="405" height="530" rx="28" fill="url(#card)" stroke="#353946"/>
      <rect x="28" y="28" width="349" height="252" rx="20" fill="#171a20"/>
      <rect x="70" y="72" width="265" height="164" rx="18" fill="#242831" stroke="#d6a44a" stroke-width="3"/>
      <text x="202" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#d6a44a" font-size="19" font-weight="700">TUE + WED</text>
      <text x="202" y="174" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="30" font-weight="800">OPENINGS</text>
      <rect x="112" y="196" width="180" height="25" rx="12" fill="#d6a44a"/>
      <text x="30" y="330" font-family="Arial,Helvetica,sans-serif" fill="#d6a44a" font-size="18" font-weight="700" letter-spacing="3">CONVERSION</text>
      <text x="30" y="382" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="35" font-weight="800">Give Saturday</text>
      <text x="30" y="423" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="35" font-weight="800">back.</text>
      <text x="30" y="475" font-family="Arial,Helvetica,sans-serif" fill="#aeb3bd" font-size="20">Book Tuesday or Wednesday.</text>
    </g>
  </g>

  <g font-family="Arial,Helvetica,sans-serif">
    <text x="110" y="920" fill="#7f8590" font-size="19" letter-spacing="2">AMPLIFI CAMPAIGN PROOF • OBJECTIVE → ANGLE → POSTS → APPROVAL</text>
    <text x="1490" y="920" text-anchor="end" fill="#d6a44a" font-size="20" font-weight="700">READY FOR REVIEW</text>
  </g>
</svg>
