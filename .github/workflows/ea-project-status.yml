name: EA project status

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-active-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EA_STATUS_GITHUB_TOKEN: ${{ secrets.EA_STATUS_GITHUB_TOKEN || github.token }}
      EA_STATUS_VERCEL_TOKEN: ${{ secrets.EA_STATUS_VERCEL_TOKEN }}
      EA_STATUS_VERCEL_TEAM_ID: ${{ vars.EA_STATUS_VERCEL_TEAM_ID }}
      EA_STATUS_FAIL_ON_CRITICAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify registry contracts
        run: node scripts/test-ea-project-status.mjs
      - name: Check GitHub, Vercel and public status
        run: node scripts/run-ea-project-status.mjs
      - name: Preserve status report
        uses: actions/upload-artifact@v4
        with:
          name: ea-project-status-${{ github.run_id }}
          path: artifacts/project-status/
          retention-days: 30
