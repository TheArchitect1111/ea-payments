name: EA Production Gate
on:
  push:
    branches: [master, fix/client-agnostic-chassis-3ab5027]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ea-production-promotion
  cancel-in-progress: false

jobs:
  staging-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify both client contracts, never live certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ea-staging
          for CLIENT in tarris amanda; do
            node --import tsx src/chassis/runClickTest.ts --client="$CLIENT" --mode=contract | tee "artifacts/ea-staging/$CLIENT.log"
            grep -q '14/14 CLICK PASS' "artifacts/ea-staging/$CLIENT.log"
            grep -q 'CONTRACT ONLY' "artifacts/ea-staging/$CLIENT.log"
            grep -q '"productionEligible": false' "artifacts/ea-staging/$CLIENT.log"
          done
          if grep -r -n -i -E 'aesthetikine|24900' src/chassis --include='*.ts'; then exit 1; fi
          if grep -r -n 'aesthetikine' src/clients/tarris; then exit 1; fi
          echo '0 client references in chassis; 0 foreign booking references in Tarris'
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ea-staging-contract-evidence
          path: artifacts/ea-staging
  gate-and-promote:
    if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[EA-LIVE-CANDIDATE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run LEGO 14-brick and print full log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ea-gate
          node --import tsx src/chassis/runClickTest.ts --client=tarris 2>&1 | tee /tmp/click.log
          cat /tmp/click.log
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/click.log','utf8');
          const match = text.match(/\{\s*"click"\s*:\s*"14\/14"[\s\S]*\}/);
          if (!match) throw Error('BLOCKED: missing 14/14 JSON');
          const outcome = JSON.parse(match[0]);
          if (outcome.productionEligible !== true || outcome.verificationType !== 'live') throw Error('BLOCKED: contract evidence cannot promote production');
          if (outcome.passed !== true || outcome.results?.length !== 14 || outcome.results.some(r => r.click !== true || !r.evidence)) throw Error('BLOCKED: 14/14 not verified');
          fs.writeFileSync('artifacts/ea-gate/chassis-click.json',JSON.stringify(outcome,null,2));
          console.log('14/14 CLICK PASS');
          NODE
          if grep -r -n -i -E 'aesthetikine|24900' src/chassis --include='*.ts'; then
            echo 'BLOCKED: client value leaked into generic chassis'
            exit 1
          fi
      - name: Write manifest with current source SHA and checked evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || { echo 'BLOCKED: master changed'; exit 1; }
          mkdir -p .ea/gates
          node - <<'NODE'
          const fs = require('node:fs');
          const proof = JSON.parse(fs.readFileSync('artifacts/ea-gate/chassis-click.json','utf8'));
          if (proof.passed !== true || proof.click !== '14/14' || proof.results?.length !== 14) throw Error('Refusing false 14/14 manifest');
          const sha = process.env.GITHUB_SHA;
          fs.writeFileSync('.ea/gates/latest.json',JSON.stringify({
            sourceCommit:sha,sha,timestamp:new Date().toISOString(),
            bricks:14,click:'14/14 PASS',generic:true,clientLeak:0,
            evidence:Object.fromEntries(proof.results.map(r=>[r.id,r.evidence])),
            verificationType:'chassis contract and live checks as described by each evidence entry'
          },null,2)+'\n');
          NODE
          test "$(node -p "require('./.ea/gates/latest.json').sha")" = "$GITHUB_SHA"
          cat .ea/gates/latest.json
      - name: Create manifest-only production promotion commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EA Production Gate"
          git config user.email "ea-production-gate@users.noreply.github.com"
          git add .ea/gates/latest.json
          CHANGED=$(git diff --cached --name-only)
          test -z "$CHANGED" || test "$CHANGED" = ".ea/gates/latest.json" || { echo "BLOCKED: promotion contains non-manifest changes"; exit 1; }
          git diff --cached --quiet && { echo 'Manifest unchanged'; exit 0; }
          git commit -m "[EA-GATED] LEGO certified source $GITHUB_SHA"
          git push origin HEAD:master
