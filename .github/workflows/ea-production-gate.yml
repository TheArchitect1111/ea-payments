name: EA Production Gate

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel preview URL for the current master SHA
        required: false
        type: string
      route_path:
        description: Route to visually and functionally verify
        required: true
        default: /amanda-catherine
        type: string
      min_visuals:
        description: Minimum number of visible image/background assets required
        required: true
        default: '2'
        type: string
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ea-production-promotion
  cancel-in-progress: false

jobs:
  gate-and-promote:
    if: github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, '[EA-GATED]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify master has not moved
        shell: bash
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${GITHUB_SHA}" || {
            echo "BLOCKED: master moved after this gate run started. Re-run against the new SHA."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: LEGO 14-brick runtime click gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ea-gate
          node --import tsx src/chassis/runClickTest.ts | tee artifacts/ea-gate/chassis-click.json
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('artifacts/ea-gate/chassis-click.json', 'utf8'));
          if (p.passed !== true || p.click !== '14/14' || !Array.isArray(p.results) || p.results.length !== 14 || p.results.some(r => r.click !== true || !r.evidence)) {
            console.error('BLOCKED: real chassis click certification incomplete', p);
            process.exit(1);
          }
          console.log('14/14 CLICK PASS verified from executable JSON results');
          NODE
          if grep -r -n -E 'aesthetikine|249' src/chassis --include='*.ts'; then
            echo 'BLOCKED: client value leaked into chassis'
            exit 1
          fi
          echo 'Generic chassis literal leak check PASS'

      - name: Client protection contract gate
        run: node scripts/test-production-protection.mjs

      - name: Build gate
        env:
          VERCEL_ENV: preview
        run: npm run build

      - name: TB3 host routing regression gate
        run: node scripts/test-tb3-host-routing.mjs

      - name: Install Chromium for visual gates
        run: npx playwright install --with-deps chromium

      - name: Resolve gate request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node -e "const f=require('./.ea/dispatch/production-gate.json'); for (const [k,v] of Object.entries({EA_PREVIEW_URL:f.preview_url,EA_GATE_PATH:f.route_path,EA_MIN_VISUALS:String(f.min_visuals??2),EA_RELEASE_PROFILE:f.release_profile||'',EA_REQUESTED_SOURCE_COMMIT:''})) console.log(k+'='+v)" >> "$GITHUB_ENV"
          else
            echo "EA_PREVIEW_URL=${{ inputs.preview_url }}" >> "$GITHUB_ENV"
            echo "EA_GATE_PATH=${{ inputs.route_path }}" >> "$GITHUB_ENV"
            echo "EA_MIN_VISUALS=${{ inputs.min_visuals }}" >> "$GITHUB_ENV"
          fi
      - name: Run EA preview gate
        env:
          EA_PREVIEW_URL: ${{ env.EA_PREVIEW_URL || inputs.preview_url || 'https://ea-payments-git-master-the-architects-projects-cc813778.vercel.app' }}
          EA_SOURCE_COMMIT: ${{ github.sha }}
          EA_GATE_PATH: ${{ env.EA_GATE_PATH || inputs.route_path || '/ctp/cigar' }}
          EA_GATE_OUTPUT: artifacts/ea-gate
          VERCEL_ENV: preview
          NODE_ENV: production
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/ea-preview-gate.mjs

      - name: Upload immutable gate proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea-production-gate-${{ github.sha }}
          path: artifacts/ea-gate
          if-no-files-found: error
          retention-days: 30

      - name: Re-verify source has not moved
        shell: bash
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${GITHUB_SHA}" || {
            echo "BLOCKED: source changed during QA. Proof is stale."
            exit 1
          }

      - name: Create evidence-backed production manifest and promote
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ea/gates
          node - <<'NODE'
          const fs = require('node:fs');
          const click = JSON.parse(fs.readFileSync('artifacts/ea-gate/chassis-click.json','utf8'));
          const preview = JSON.parse(fs.readFileSync('artifacts/ea-gate/gate-result.json','utf8'));
          const sha = process.env.GITHUB_SHA;
          if (click.passed !== true || click.click !== '14/14' || click.results.length !== 14 || click.results.some(r => r.click !== true)) {
            throw Error('Refusing manifest promotion: 14/14 bricks not verified');
          }
          if (preview.status !== 'PASS' || preview.sourceCommit !== sha) {
            throw Error('Refusing manifest promotion: preview gate PASS and current-source identity required');
          }
          const record = {
            ...preview,
            sha,
            sourceCommit: sha,
            timestamp: new Date().toISOString(),
            bricks: 14,
            click: '14/14 PASS',
            health: '14/14 200',
            generic: true,
            clientLeak: 0,
            evidence: Object.fromEntries(click.results.map(({id,evidence}) => [id,evidence])),
            verificationType: 'operational-click-test; provider delivery only where evidenced',
            chassis: click
          };
          fs.writeFileSync('.ea/gates/latest.json',JSON.stringify(record,null,2)+'\n');
          console.log(JSON.stringify({sha,click:record.click,preview:preview.status},null,2));
          NODE
          test "$(node -p "require('./.ea/gates/latest.json').sha")" = "$GITHUB_SHA"
          git config user.name "EA Production Gate"
          git config user.email "ea-production-gate@users.noreply.github.com"
          git add .ea/gates/latest.json
          git diff --cached --name-only | grep -qx '.ea/gates/latest.json'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m "[EA-GATED] Promote chassis proof for ${GITHUB_SHA}"
          git push origin HEAD:master
