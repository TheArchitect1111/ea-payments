name: Amanda V3 Motion Forms Portal Continuity
on:
  workflow_dispatch:
  push:
    branches: ['premium/amanda-upgrade']
    paths:
      - 'scripts/test-amanda-v3-10-12.mjs'
      - '.github/workflows/amanda-v3-10-12.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check motion and Amanda signup/login presentation
        run: node scripts/test-amanda-v3-10-12.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amanda-v3-motion-forms-portal-evidence
          path: artifacts/amanda-v3-10-12/
