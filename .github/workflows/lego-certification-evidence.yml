name: Lego certification evidence report

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'src/**'
      - 'vendor/**'
      - 'config/capability-inventory.json'
      - 'config/module-certification-contract.json'
      - 'config/module-certification-evidence.json'
      - 'scripts/run-lego-certification-evidence.mjs'
      - 'scripts/test-lego-certification-contract.mjs'
      - '.github/workflows/lego-certification-evidence.yml'
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'src/**'
      - 'vendor/**'
      - 'config/capability-inventory.json'
      - 'config/module-certification-contract.json'
      - 'config/module-certification-evidence.json'
      - 'scripts/run-lego-certification-evidence.mjs'
      - 'scripts/test-lego-certification-contract.mjs'
      - '.github/workflows/lego-certification-evidence.yml'

permissions:
  contents: read

jobs:
  evidence-report:
    name: Diagnostic only — certification evidence report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run module tests and bind results to source
        run: node scripts/run-lego-certification-evidence.mjs
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego-certification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lego-certification/latest.json
          if-no-files-found: error
          retention-days: 14
