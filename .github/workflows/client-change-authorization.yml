name: Client change authorization

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect protected client changes
        id: protected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          if grep -Eq '^(app/amanda-catherine/|public/amanda-catherine/|lib/amanda-catherine/|lib/portal-universal/packs/|config/ea-active-projects\.json)' /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require recorded client approval
        if: github.event_name == 'pull_request' && steps.protected.outputs.changed == 'true'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          node -e "const labels=JSON.parse(process.env.LABELS_JSON); if(!labels.includes('client-approved')) { console.error('Protected client files changed without the client-approved label.'); process.exit(1) }"
      - name: Reject direct protected changes to production
        if: github.event_name == 'push' && steps.protected.outputs.changed == 'true'
        run: |
          echo "Protected client files were pushed directly to master. Production client changes must use a reviewed pull request with the client-approved label."
          exit 1
