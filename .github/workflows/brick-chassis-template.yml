name: Canonical Brick Chassis V1
on:
  push:
    branches: [template/brick-chassis-v1]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove guard rejects bypass
        run: node scripts/guard-brick-chassis.mjs --self-test
      - name: Block all direct tracking and Airtable registration bypasses
        run: npm run test:brick-chassis-guard
      - run: npm test
      - run: npm run build
      - name: Production preview tests return 404
        run: |
          VERCEL_ENV=production npx next start -p 3132 >/tmp/chassis.log 2>&1 &
          PID=$!
          trap 'kill "$PID"' EXIT
          for i in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3132/api/tarris/brick-dollar-test || true)
            test "$status" = "404" && break
            sleep 1
          done
          for method in GET POST; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" http://127.0.0.1:3132/api/tarris/brick-dollar-test)
            test "$status" = "404" || exit 1
          done
