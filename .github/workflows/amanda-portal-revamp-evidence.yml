name: Amanda Portal Revamp Evidence
on:
  workflow_dispatch:
  push:
    branches: [revamp/amanda-portal-chassis]
  pull_request:
    paths:
      - 'app/portal/amanda-catherine/owner/**'
      - 'app/review/amanda-portal/**'
      - 'tests/amanda-recovery/amanda-portal-revamp.spec.ts'
      - 'playwright.amanda-portal.config.ts'
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AMANDA_PORTAL_REVAMP_URL: https://ea-payments-git-revamp-69a6f3-the-architects-projects-cc813778.vercel.app
      VERCEL_SHARE_TOKEN: n3kx5wQtlHelOOBqKMPnK7FHU4pVqxDl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run portal revamp evidence
        run: npx playwright test tests/amanda-recovery/amanda-portal-revamp.spec.ts --config=playwright.amanda-portal.config.ts --project="Desktop Chrome" --project="Pixel 7"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amanda-portal-revamp-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
