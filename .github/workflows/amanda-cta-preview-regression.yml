name: Amanda CTA Preview Regression
on:
  pull_request:
    paths:
      - 'app/portal/amanda-catherine/**'
      - 'app/courses/**'
      - 'app/amanda-catherine/courses/**'
      - 'lib/amanda-catherine/**'
      - 'components/amanda/**'
      - 'scripts/test-amanda-cta-grid.mjs'
      - '.github/workflows/amanda-cta-preview-regression.yml'
  workflow_dispatch:
    inputs:
      preview_url:
        description: Immutable Vercel preview URL
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  grid-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify same-page Classes navigation and 12 class CTAs on desktop/mobile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          AMANDA_CTA_PREVIEW_URL: ${{ inputs.preview_url }}
        run: node scripts/test-amanda-cta-grid.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amanda-classes-desktop-mobile
          path: artifacts/amanda-classes
