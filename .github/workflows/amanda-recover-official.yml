name: Amanda official deployment recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/amanda-recover-official.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Fetch historical Amanda deployments
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set +e
          mkdir -p recovered
          urls=(
            'https://amanda-catherine-4-i9g55smwt-the-architects-projects-cc813778.vercel.app/'
            'https://amanda-catherine-4-pbkipaetz-the-architects-projects-cc813778.vercel.app/'
            'https://amanda-catherine-4-8t3zucm9f-the-architects-projects-cc813778.vercel.app/'
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            code=$(curl -L -sS -o "recovered/candidate-$n.html" -w '%{http_code}' \
              -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" "$url")
            echo "$url $code $(wc -c < recovered/candidate-$n.html)" | tee -a recovered/status.txt
          done
          cat recovered/status.txt
      - name: Upload recovered candidates
        uses: actions/upload-artifact@v4
        with:
          name: amanda-official-candidates
          path: recovered/
          retention-days: 1
