name: Publish Tarris Contract

on:
  push:
    paths:
      - '.github/workflows/publish-tarris-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch approved contract
        run: |
          mkdir -p public/contracts
          curl --fail --location --retry 3 \
            'https://cc.efficiencyarchitects.online/api/contracts/tarris-official-pdf' \
            --output public/contracts/Tarris_Bouie_Client_Services_Agreement_OFFICIAL.pdf
          test "$(head -c 4 public/contracts/Tarris_Bouie_Client_Services_Agreement_OFFICIAL.pdf)" = "%PDF"
          test "$(wc -c < public/contracts/Tarris_Bouie_Client_Services_Agreement_OFFICIAL.pdf)" -gt 10000

      - name: Commit static PDF
        run: |
          git config user.name 'EA Contract Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add public/contracts/Tarris_Bouie_Client_Services_Agreement_OFFICIAL.pdf
          if git diff --cached --quiet; then
            echo 'Contract already current.'
          else
            git commit -m 'Publish Tarris official contract PDF'
            git push
          fi
