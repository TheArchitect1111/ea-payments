name: Amanda Publish Body Sculpt Intensive

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/amanda-publish-body-sculpt-intensive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install approved Body Sculpt asset
        shell: bash
        run: |
          mkdir -p public/amanda-catherine
          cat > /tmp/amanda-body-sculpt.b64 <<'EOF'
