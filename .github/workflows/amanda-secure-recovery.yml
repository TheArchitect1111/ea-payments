name: Amanda secure official recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/amanda-secure-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ephemeral recovery key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out public.pem 2>/dev/null
          echo "${{ github.run_id }}" > recovery-run-id.txt
      - name: Publish recovery public key
        uses: actions/upload-artifact@v4
        with:
          name: amanda-recovery-public-key
          path: |
            public.pem
            recovery-run-id.txt
          retention-days: 1
      - name: Wait for encrypted one-time URL
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in $(seq 1 90); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/TheArchitect1111/ea-payments/contents/.github/amanda-recovery-cipher.txt?ref=master" \
              -o /tmp/cipher.json 2>/dev/null || true
            jq -r '.content // empty' /tmp/cipher.json 2>/dev/null | tr -d '\n' | base64 -d > /tmp/cipher.txt 2>/dev/null || true
            if grep -q "^RUN_ID:$RUN_ID$" /tmp/cipher.txt 2>/dev/null; then
              tail -n +2 /tmp/cipher.txt | base64 -d > /tmp/cipher.bin
              openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/cipher.bin -out /tmp/share-url.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
              break
            fi
            sleep 2
          done
          test -s /tmp/share-url.txt
      - name: Recover protected official deployment
        run: |
          set -e
          url=$(cat /tmp/share-url.txt)
          mkdir -p recovered
          curl -L -sS -c /tmp/cookies.txt -b /tmp/cookies.txt -o recovered/official-candidate.html "$url"
          printf '%s\n' "$(wc -c < recovered/official-candidate.html) bytes" > recovered/status.txt
          grep -Eio '<title>[^<]*|Strategic Connector|Return to Centre|Restore\. Learn\. Create\.|Created by Efficiency Architects|Amanda Catherine' recovered/official-candidate.html | head -50 > recovered/markers.txt || true
      - name: Upload recovered official candidate
        uses: actions/upload-artifact@v4
        with:
          name: amanda-secure-recovered-candidate
          path: recovered/
          retention-days: 1

# Recovery pass 4: latest pre-regression official deployment.
