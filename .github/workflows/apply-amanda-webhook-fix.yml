name: Apply Amanda webhook fix

on:
  push:
    branches:
      - fix/amanda-enrollment-webhook-owner-notice

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Amanda Stripe webhook routing fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amanda-enrollment-webhook-owner-notice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch webhook
        run: node scripts/apply-amanda-webhook-fix.mjs
      - name: Commit webhook fix
        run: |
          if git diff --quiet; then
            echo "No webhook changes needed"
            exit 0
          fi
          git config user.name "EA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/webhooks/stripe/route.ts
          git commit -m "Apply Amanda Stripe webhook routing fix"
          git push origin HEAD:fix/amanda-enrollment-webhook-owner-notice
