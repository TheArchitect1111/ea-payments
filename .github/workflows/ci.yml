name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 3
      - name: Verify EA Capability Standard and Run 1 inventory
        run: node scripts/test-capability-standard.mjs
      - name: Certify EA Modular Assembly Run 2
        run: npx tsx scripts/test-modular-assembly-run2.ts
      - name: Verify EA Modular Assembly Run 3
        run: npx tsx scripts/test-modular-assembly-run3.ts
      - name: Certify EA Modular Assembly Run 4 Starter package
        run: npx tsx scripts/test-modular-assembly-run4.ts
      - name: Verify EA Modular Assembly Run 5 durable evidence
        run: npx tsx scripts/test-modular-assembly-run5.ts
      - name: Certify EA Modular Assembly Run 6 capability wave
        run: npx tsx scripts/test-modular-assembly-run6.ts
      - name: Verify EA System Registry contract
        run: node scripts/test-system-registry.mjs
      - name: Verify EA Control Plane reconciliation contract
        run: npx tsx scripts/test-control-plane.ts
      - name: Verify Run 4 durable reliability contracts
        run: npx tsx scripts/test-run4-reliability.ts
      - name: Certify Run 5 scale and failure contracts
        run: npx tsx scripts/test-run5-scale-certification.ts
      - name: Verify compensating master guard contract
        run: node scripts/test-master-guard-contract.mjs
      - name: Verify generalized production protection contracts
        run: node scripts/test-production-protection.mjs
      - name: Verify tenant isolation and authorization release contracts
        run: node scripts/test-tenant-release-safety.mjs
      - name: Verify mandatory release guardrails
        run: node scripts/test-release-guardrails.mjs
      - name: Verify Recovery Orchestrator safety contract
        run: npx tsx scripts/test-recovery-orchestrator.ts
      - name: Certify Recovery Orchestrator self-healing loop
        run: npx tsx scripts/test-recovery-certification.ts
      - name: Verify Recovery Monitoring contract
        run: node scripts/test-recovery-monitoring-contract.mjs
      - name: Verify Client Factory fulfillment contract
        run: npx tsx scripts/test-factory-fulfillment.ts
      - name: Verify Amanda checkout and pricing contract
        run: npm run test:amanda-checkout
      - name: Verify Design Studio registry contract
        run: node scripts/test-design-studio-registry-contract.mjs
      - name: Verify Simplifi Orb and monitoring contracts
        run: npm run test:simplifi-hardening
      - name: Verify deploy (build + resolver + browser smoke)
        run: |
          npx playwright install --with-deps chromium
          npm run verify:deploy
      - name: Verify live customer recovery journeys
        run: node scripts/test-recovery-journeys.mjs
