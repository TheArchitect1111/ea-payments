name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Run A: release boundaries.
# Universal PR blocking is intentionally limited to platform safety and the
# certified assembly contract. Product/client/legacy suites own separate gates.
jobs:
  platform-core:
    name: platform-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Production protection
        run: node scripts/test-production-protection.mjs
      - name: Tenant release safety
        run: node scripts/test-tenant-release-safety.mjs
      - name: Release guardrails
        run: node scripts/test-release-guardrails.mjs
      - name: Master guard contract
        run: node scripts/test-master-guard-contract.mjs
      - name: System registry
        run: node scripts/test-system-registry.mjs
      - name: Control plane
        run: npx tsx scripts/test-control-plane.ts

  certified-assembly:
    name: certified-assembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Capability standard
        run: node scripts/test-capability-standard.mjs
      - name: Assembly Run 2
        run: npx tsx scripts/test-modular-assembly-run2.ts
      - name: Assembly Run 3
        run: npx tsx scripts/test-modular-assembly-run3.ts
      - name: Assembly Run 4
        run: npx tsx scripts/test-modular-assembly-run4.ts
      - name: Assembly Run 5
        run: npx tsx scripts/test-modular-assembly-run5.ts
      - name: Assembly Run 6
        run: npx tsx scripts/test-modular-assembly-run6.ts
      - name: Release boundary Run A
        run: node scripts/test-release-boundary-run-a.mjs
      - name: Whole-system preflight
        run: node scripts/certify-preflight.mjs repository
      - name: Lego certification engine schema
        run: node scripts/test-lego-certification-engine-run2.mjs
      - name: Lego certification contract
        run: node scripts/test-lego-certification-contract.mjs
      - name: Lego factory lock Run 4
        run: node scripts/test-lego-factory-lock-run4.mjs
      - name: Lego evidence wave 1
        run: node scripts/test-lego-certificate-wave1.mjs
      - name: Strict Lego authority
        run: node scripts/test-lego-strict-authority.mjs

  platform-build:
    name: platform-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install Chromium for complete preflight
        run: npx playwright install --with-deps chromium
      - name: Full production-contract preflight
        run: node scripts/certify-preflight.mjs repository --full
      - name: Build and customer-journey smoke
        run: npm run verify:deploy
      - name: Recovery journeys
        run: node scripts/test-recovery-journeys.mjs
