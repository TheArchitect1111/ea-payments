name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify Recovery Orchestrator safety contract
        run: npx tsx scripts/test-recovery-orchestrator.ts

      - name: Certify Recovery Orchestrator self-healing loop
        run: npx tsx scripts/test-recovery-certification.ts

      - name: Verify Recovery Monitoring contract
        run: node scripts/test-recovery-monitoring-contract.mjs

      - name: Verify Client Factory fulfillment contract
        run: npx tsx scripts/test-factory-fulfillment.ts

      - name: Verify Amanda checkout and pricing contract
        run: npm run test:amanda-checkout

      - name: Verify Design Studio registry contract
        run: node scripts/test-design-studio-registry-contract.mjs

      - name: Verify Simplifi Orb and monitoring contracts
        run: npm run test:simplifi-hardening

      - name: Verify deploy (build + resolver + smoke)
        run: |
          npx playwright install --with-deps chromium
          npm run verify:deploy

      - name: Verify live customer recovery journeys
        run: node scripts/test-recovery-journeys.mjs