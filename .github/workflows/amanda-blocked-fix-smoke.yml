name: Amanda Blocked Fix Smoke
on:
  workflow_dispatch:
  push:
    branches: ['premium/amanda-upgrade']
    paths:
      - 'scripts/amanda-blocked-fix-smoke.mjs'
      - '.github/workflows/amanda-blocked-fix-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node scripts/amanda-blocked-fix-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amanda-blocked-fix-smoke
          path: artifacts/amanda-blocked-fix*
