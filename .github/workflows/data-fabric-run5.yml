name: Data Fabric Run 5

on:
  pull_request:
    paths:
      - 'data-fabric/**'
      - '.github/workflows/data-fabric-run5.yml'

jobs:
  validation-reconciliation-intelligence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea_fabric_run5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea_fabric_run5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ea_fabric_run5_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply Data Fabric migrations through Run 5
        run: |
          psql -v ON_ERROR_STOP=1 -f data-fabric/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f data-fabric/migrations/0002_canonical_domain.sql
          psql -v ON_ERROR_STOP=1 -f data-fabric/migrations/0003_security_governance.sql
          psql -v ON_ERROR_STOP=1 -f data-fabric/migrations/0004_connector_chassis.sql
          psql -v ON_ERROR_STOP=1 -f data-fabric/migrations/0005_mapping_reporting.sql
          psql -v ON_ERROR_STOP=1 -f data-fabric/migrations/0006_validation_reconciliation_intelligence.sql
      - name: Verify end-to-end validation reconciliation and impact intelligence
        run: psql -v ON_ERROR_STOP=1 -f data-fabric/tests/validation-reconciliation-intelligence.sql
      - name: Verify Run 5 migration registry
        run: |
          test "$(psql -Atc "SELECT count(*) FROM fabric.schema_migrations WHERE version='0006_validation_reconciliation_intelligence';")" = "1"
