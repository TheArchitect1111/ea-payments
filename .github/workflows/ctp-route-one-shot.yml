name: CTP Route One Shot

on:
  push:
    branches: ["fix/ctp-api-fail-closed"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/ctp-api-fail-closed"
      - name: Apply surgical CTP API patch
        run: python3 scripts/ctp-route-patch.py
      - name: Commit repair and remove temporary helpers
        run: |
          git config user.name "EA CTP Repair"
          git config user.email "ea-ctp-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix(ctp): fail closed at submission API boundary"
          git push origin HEAD:fix/ctp-api-fail-closed
