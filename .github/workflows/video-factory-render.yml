name: video-factory-render

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Video project id
        required: true
        default: wealthy-debt
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/video-factory-render.yml'
      - 'video-factory/**'
      - 'lib/video-factory/**'
      - 'scripts/render-video-factory.mjs'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDEO_FACTORY_TTS_MODEL: gpt-4o-mini-tts
      VIDEO_FACTORY_TTS_VOICE: cedar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require narration secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for narrated renders."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate narration and render episode
        run: npx tsx -e "import { getVideoProject } from './lib/video-factory/registry'; import { ensureProjectNarration } from './lib/video-factory/narration'; (async()=>{ const p=getVideoProject('${{ inputs.project_id || 'wealthy-debt' }}'); if(!p) throw new Error('Unknown project'); await ensureProjectNarration(p,true); })().catch((e)=>{ console.error(e); process.exit(1); });" && npm run video:render -- ${{ inputs.project_id || 'wealthy-debt' }}

      - name: Verify audible narration and commit production asset
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          PROJECT="${{ inputs.project_id || 'wealthy-debt' }}"
          FILE="public/video-factory/${PROJECT}.mp4"
          AUDIO_DIR="public/video-factory/audio/${PROJECT}"

          test -s "$FILE"
          test -d "$AUDIO_DIR"
          MP3_COUNT=$(find "$AUDIO_DIR" -type f -name '*.mp3' -size +1000c | wc -l)
          if [ "$MP3_COUNT" -lt 1 ]; then
            echo "No generated narration MP3 files found."
            exit 1
          fi

          AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$FILE" | wc -l)
          if [ "$AUDIO_STREAMS" -lt 1 ]; then
            echo "Rendered MP4 has no audio stream."
            exit 1
          fi

          MEAN_DB=$(ffmpeg -hide_banner -i "$FILE" -af volumedetect -f null - 2>&1 | awk '/mean_volume:/ {print $(NF-1)}' | tail -1)
          if [ -z "$MEAN_DB" ]; then
            echo "Could not measure rendered audio volume."
            exit 1
          fi
          awk -v db="$MEAN_DB" 'BEGIN { if (db <= -50) exit 1 }' || {
            echo "Rendered MP4 audio is effectively silent: ${MEAN_DB} dB"
            exit 1
          }

          echo "Narration verified: ${MP3_COUNT} MP3 files, mean audio ${MEAN_DB} dB"
          ffprobe -v error -show_entries format=duration,size -show_streams "$FILE"

          git config user.name "EA Video Factory"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE" "$AUDIO_DIR"/
          git status --short
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 1
          fi
          git commit -m "Render narrated ${PROJECT} episode"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
