name: video-factory-render

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Video project id
        required: true
        default: wealthy-debt
  push:
    branches:
      - fix/video-factory-narrated-production
    paths:
      - '.github/workflows/video-factory-render.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDEO_FACTORY_TTS_MODEL: gpt-4o-mini-tts
      VIDEO_FACTORY_TTS_VOICE: cedar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require narration secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for narrated renders."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate narration and render episode
        run: npx tsx -e "import { getVideoProject } from './lib/video-factory/registry'; import { ensureProjectNarration } from './lib/video-factory/narration'; (async()=>{ const p=getVideoProject('${{ inputs.project_id || 'wealthy-debt' }}'); if(!p) throw new Error('Unknown project'); await ensureProjectNarration(p,true); })().catch((e)=>{ console.error(e); process.exit(1); });" && npm run video:render -- ${{ inputs.project_id || 'wealthy-debt' }}

      - name: Verify MP4 has audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          FILE="public/video-factory/${{ inputs.project_id || 'wealthy-debt' }}.mp4"
          test -s "$FILE"
          AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$FILE" | wc -l)
          if [ "$AUDIO_STREAMS" -lt 1 ]; then
            echo "Rendered MP4 has no audio stream."
            exit 1
          fi
          ffprobe -v error -show_entries format=duration,size -show_streams "$FILE"

      - name: Commit narrated production asset
        run: |
          git config user.name "EA Video Factory"
          git config user.email "actions@users.noreply.github.com"
          git add public/video-factory/${{ inputs.project_id || 'wealthy-debt' }}.mp4 public/video-factory/audio/${{ inputs.project_id || 'wealthy-debt' }}/
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Render narrated ${{ inputs.project_id || 'wealthy-debt' }} episode"
          git push
