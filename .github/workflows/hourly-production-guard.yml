name: EA Payments Hourly Production Guard

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ea-payments-hourly-production-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production availability
        shell: bash
        run: |
          set -euo pipefail
          URL='https://efficiencyarchitects.online/'
          BODY="$(mktemp)"
          CODE="$(curl -L -sS --max-time 30 -o "$BODY" -w '%{http_code}' "$URL")"
          test "$CODE" = '200'
          test "$(wc -c < "$BODY")" -gt 500

      - name: Verify Amanda authenticated portal path
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          CODE="$(curl -sS --max-time 30 -o "$BODY" -w '%{http_code}' 'https://efficiencyarchitects.online/api/health/amanda-login')"
          test "$CODE" = '200'
          grep -q '"ok":true' "$BODY"
          grep -q '"authenticatedOwnerRoute":true' "$BODY"
          grep -q '"authenticatedPortalHome":true' "$BODY"
          grep -q '"authenticatedMemberRoute":true' "$BODY"
          grep -q '"premiumOwnerDashboard":true' "$BODY"

      - name: Verify Amanda public and login routes
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            'https://amandacatherine.ca/' \
            'https://www.amandacatherine.ca/' \
            'https://efficiencyarchitects.online/portal/login?next=/amanda-business' \
            'https://efficiencyarchitects.online/portal/amanda-catherine/enroll' \
            'https://efficiencyarchitects.online/portal/amanda-catherine/learning'; do
            CODE="$(curl -L -sS --max-time 30 -o /dev/null -w '%{http_code}' "$URL")"
            test "$CODE" = '200'
          done

      - name: Open or update incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='[Production Guard] EA client access failure detected';
            const body=`Production guard failed at ${new Date().toISOString()}. This guard includes Amanda Catherine public availability, authenticated owner, canonical-home, member-route, and premium owner-dashboard checks. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            if(existing) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
