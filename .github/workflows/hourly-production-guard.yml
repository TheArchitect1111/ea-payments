name: EA Client Production Guard

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ea-client-production-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout protection profiles
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify protected client source contracts and live production
        env:
          EA_PROTECTION_LIVE: 'true'
          EA_PLATFORM_ORIGIN: 'https://efficiencyarchitects.online'
        run: node scripts/test-production-protection.mjs

      - name: Verify EA production root
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          CODE="$(curl -L -sS --max-time 30 -o "$BODY" -w '%{http_code}' 'https://efficiencyarchitects.online/')"
          test "$CODE" = '200'
          test "$(wc -c < "$BODY")" -gt 500

      - name: Open or update production incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='[Production Guard] EA protected client failure detected';
            const body=`Production protection failed at ${new Date().toISOString()}. The guard validates protected source contracts, public availability, portal/login routes, authenticated Amanda owner experience, owner menu routes, course-resource routes, and private course-material inventory. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            if(existing) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
