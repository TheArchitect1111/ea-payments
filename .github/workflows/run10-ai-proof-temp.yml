name: Run 10 Temporary AI Proof

on:
  push:
    branches:
      - run10-temp-probe-20260911

permissions:
  contents: read

jobs:
  prove-live-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected preview AI smoke route
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROBE_URL: https://ea-payments-r6yhkgrep-the-architects-projects-cc813778.vercel.app/api/internal/run10-ai-smoke
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BYPASS_SECRET"
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$PROBE_URL")
          echo "HTTP $status"
          test "$status" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          if (!body.ok) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          if (!body.provider || !body.model) {
            console.error('Missing provider/model evidence');
            process.exit(1);
          }
          console.log(JSON.stringify({ ok: body.ok, provider: body.provider, model: body.model, latencyMs: body.latencyMs }));
          NODE
