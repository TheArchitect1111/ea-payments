name: EA Recovery Journey Monitor

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ea-recovery-journey-monitor
  cancel-in-progress: true

jobs:
  journey-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run customer journey recovery probes
        run: node scripts/test-recovery-journeys.mjs

      - name: Open or update recovery journey incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='[Recovery Monitor] Customer journey failure detected';
            const body=`A production customer-journey probe failed at ${new Date().toISOString()}. The browser monitor checks EA, Amplifi, Amanda public/portal entry, and CPR for availability, known failure text, approved markers, and broken images. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            if(existing) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
