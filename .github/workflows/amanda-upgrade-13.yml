name: Amanda V3 Upgrade 13 Responsive Audit
on:
  workflow_dispatch:
  push:
    branches: ['premium/amanda-upgrade']
    paths:
      - 'scripts/test-amanda-upgrade-13.mjs'
      - '.github/workflows/amanda-upgrade-13.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-amanda-upgrade-13.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amanda-upgrade-13-four-width-evidence
          path: artifacts/amanda-v3-upgrade-13/
