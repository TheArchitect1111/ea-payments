name: Amanda V3 Final Acceptance
on:
  workflow_dispatch:
  push:
    branches: ['premium/amanda-upgrade']
    paths:
      - 'scripts/amanda-v3-final-acceptance.mjs'
      - '.github/workflows/amanda-v3-final-acceptance.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Public journey and visual regression
        run: node scripts/amanda-v3-final-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amanda-v3-final-acceptance-evidence
          path: artifacts/amanda-v3-acceptance/
