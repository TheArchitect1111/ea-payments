name: Amanda Blob repair
on:
  push:
    branches: [verify/amanda-blob-repair]
    paths:
      - '.github/workflows/amanda-blob-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Wait for preview and repair Amanda private Blob paths
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          URL: https://ea-payments-git-verify-31ae89-the-architects-projects-cc813778.vercel.app/api/internal/amanda-blob-repair
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/repair.json -w '%{http_code}' \
              -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
              "$URL" || true)
            echo "attempt=$i status=$code"
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              cat /tmp/repair.json
              exit 0
            fi
            sleep 10
          done
          echo 'Amanda repair endpoint did not become reachable in time.' >&2
          exit 1
