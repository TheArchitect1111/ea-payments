name: Tag Amanda certified merge
on:
  push:
    branches: [release/amanda-certified-production]
    paths: ['.github/workflows/tag-amanda-certified.yml']
permissions:
  contents: write
concurrency:
  group: tag-amanda-certified
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Wait for verified production and push certification tag
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const merge='6c84f90960036aa26f5f1560ad7822f3c93dc6de';
          const origin='https://ea-payments.vercel.app';
          let ready=false;
          for(let i=0;i<100;i++){
            try{
              const r=await fetch(origin+'/api/ops/build-info',{cache:'no-store'});
              const info=await r.json();
              if(r.ok && info.environment==='production' && info.branch==='master' && /^[0-9a-f]{40}$/.test(info.commitSha)){
                execFileSync('git',['fetch','origin','master'],{stdio:'ignore'});
                const ancestor=execFileSync('git',['merge-base',merge,info.commitSha],{encoding:'utf8'}).trim();
                if(ancestor===merge){
                  const manifest=JSON.parse(execFileSync('git',['show',info.commitSha+':.ea/gates/latest.json'],{encoding:'utf8'}));
                  const parent=execFileSync('git',['rev-parse',info.commitSha+'^'],{encoding:'utf8'}).trim();
                  if(manifest.status!=='PASS'||manifest.sourceCommit!==parent)throw Error('Production gate proof is invalid');
                  const route=origin+'/api/amanda-catherine/preview-dollar-test';
                  for(const method of ['GET','POST']){
                    const response=await fetch(route,{method,redirect:'manual'});
                    const text=await response.text();
                    if(response.status!==404||!text.includes('available only on the named Vercel preview branch'))throw Error('Production test guard failed: '+method);
                  }
                  console.log('Verified production '+info.commitSha+' and GET/POST test guard 404');
                  ready=true;break;
                }
              }
            }catch(e){console.log('Waiting: '+e.message);}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready)throw Error('Production did not reach certified state; no tag created');
          NODE
          git tag brick-amanda-certified 6c84f90960036aa26f5f1560ad7822f3c93dc6de
          git push origin refs/tags/brick-amanda-certified
